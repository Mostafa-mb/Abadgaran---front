<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="styles/app.css" />
  </head>
  <body
    class="bg-[url('/public/images/login&signup/Login-mobile.webp')] md:bg-[url('/public/images/login&signup/Login-desktop.webp')] bg-no-repeat bg-cover bg-center min-h-screen font-textMedium relative min-w-screen"
  >
    <!-- overlay -->
    <div class="fixed inset-0 bg-black/10 backdrop-brightness-75 z-0"></div>

    <main
      class="relative z-10 flex min-h-screen items-center justify-center p-4"
    >
      <div class="w-full max-w-7xl mx-auto">
        <div class="flex items-center justify-center">
          <a
            href=""
            class="md:col-start-2 md:col-end-6 justify-self-start md:justify-self-center"
            ><img
              src="images/Logo-04.webp"
              alt=""
              class="h-20 md:h-30 max-w-7xl"
          /></a>
        </div>

        <!-- login container -->
        <div class="grid grid-cols-1 md:grid-cols-6">
          <div
            class="md:col-start-2 lg:col-start-3 md:col-end-6 lg:col-end-5 flex flex-col"
          >
            <!-- login header -->
            <div
              class="col-span-full md:col-start-12 md:col-end-6 bg-white w-full rounded-2xl shadow-2xl p-4"
            >
              <div class="relative flex items-center justify-center">
                <div class="flex flex-col gap-y-3 items-center col-start-2">
                  <h1 class="text-xl md:text-2xl font-titleBold text-center">
                    ورود کاربر
                  </h1>
                  <span class="text-sm md:text-base text-gray-500"
                    >حساب کاربری ندارید؟
                    <a href="" class="text-[#997D3A] font-textBold">ثبت نام</a>
                  </span>
                </div>
                <a href="" class="text-base absolute left-0 top-[30%]">
                  <span class="flex items-center justify-center"
                    ><i class="fa-solid fa-arrow-left-long"></i
                  ></span>
                </a>
              </div>
              <div class="flex flex-col mt-5 gap-y-4 text-sm md:text-base">
                <div
                  class="flex items-center min-h-14 border rtl:pr-5 rtl:pl-2 ltr:pl-5 py-2 border-gray-200 rounded-md"
                >
                  <input
                    type="text"
                    placeholder="تلفن همراه را وارد کنید"
                    class="outline-0 w-full"
                    maxlength="11"
                  />
                  <span class="text-gray-600 flex items-center justify-center">
                    <i class="fa-solid fa-phone"></i>
                  </span>
                </div>
                <div
                  class="flex items-center min-h-14 border rtl:pr-5 rtl:pl-2 ltr:pl-5 py-2 border-gray-200 rounded-md"
                >
                  <input
                    type="password"
                    placeholder="رمز عبور را وارد کنید"
                    class="outline-0 w-full"
                  />
                  <span
                    class="text-gray-600 flex items-center justify-center cursor-pointer"
                  >
                    <i class="fa-solid fa-eye"></i>
                    <!-- <i class="fa-solid fa-eye-slash"></i> -->
                  </span>
                </div>
                <div class="flex justify-between items-center gap-x-2">
                  <div
                    class="flex basis-full items-center min-h-14 border rtl:pr-5 rtl:pl-2 ltr:pl-5 py-2 border-gray-200 rounded-md"
                  >
                    <input
                      type="password"
                      placeholder="متن تصویر را وارد کنید"
                      class="outline-0 w-full"
                    />
                  </div>
                  <div>
                    <img
                      src="images/login&signup/Captcha.webp"
                      alt=""
                      class="h-14 aspect-auto"
                    />
                  </div>
                </div>
                <button class="text-center mt-3 py-3 bg-AbaPrimary rounded-xl font-textBold font-bold text-base">ورود</button>
              </div>
            </div>
            <!-- login header -->

            <!-- login form -->
            <div></div>
            <!-- login form -->
          </div>
        </div>
        <!-- login container -->
      </div>
    </main>

    <script src="vendor/fontAwesome/fontAwesome.js"></script>
  </body>
</html>
